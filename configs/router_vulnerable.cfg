
version 15.2
hostname R1-LAB
enable password cisco123
no service password-encryption
!
no aaa new-model
ip http server
cdp run
lldp run
!
no ip source-route
service timestamps log datetime msec
!
interface FastEthernet0/0
 ip address 192.168.1.10 255.255.255.0
!
line con 0
line vty 0 4
 password vtypass
 login
 transport input telnet ssh
!
end
