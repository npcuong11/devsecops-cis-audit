
name: DevSecOps Network and Container Security

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:

  # GIAI ĐOẠN 1: CIS NETWORK AUDIT
  cis-network-audit:
    name: CIS Cisco IOS Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Audit Vulnerable Configuration
        run: |
          python src/auditor.py configs/router_vulnerable.cfg

      - name: Audit Hardened Configuration
        run: |
          python src/auditor.py configs/router_hardened.cfg

      - name: Verify Audit Scores
        run: |
          python - <<'PY'
          import json

          tests = [
              ("audit_report_router_vulnerable.json", 12.5),
              ("audit_report_router_hardened.json", 100.0)
          ]

          for filename, expected in tests:
              with open(filename, encoding="utf-8") as f:
                  data = json.load(f)

              print(filename, data["score"])

              assert data["score"] == expected, (
                  f"Expected {expected}, got {data['score']}"
              )
          PY

      - name: Upload Audit Reports
        uses: actions/upload-artifact@v4
        with:
          name: cis-audit-reports
          path: |
            audit_report_*.json
            audit_report_*.html
          if-no-files-found: error

  # GIAI ĐOẠN 2: SECRET SCANNING
  secret-scanning:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # GIAI ĐOẠN 3: CONTAINER VULNERABILITY SCAN
  container-trivy-scan:
    name: Docker Build and Trivy Scan
    runs-on: ubuntu-latest

    needs:
      - cis-network-audit
      - secret-scanning

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build \
            -t cis-auditor-api:1.0.0 \
            ./src

      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: cis-auditor-api:1.0.0
          format: table
          exit-code: "1"
          ignore-unfixed: false
          vuln-type: os,library
          severity: CRITICAL
