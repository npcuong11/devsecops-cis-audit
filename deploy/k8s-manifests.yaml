
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cis-auditor-deployment
  labels:
    app: cis-auditor

spec:
  replicas: 1

  selector:
    matchLabels:
      app: cis-auditor

  template:
    metadata:
      labels:
        app: cis-auditor

    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: cis-auditor-api
          image: cis-auditor-api:1.0.0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: config-volume
              mountPath: /configs
              readOnly: true

            - name: tmp-volume
              mountPath: /tmp

          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "256Mi"
              cpu: "500m"

      volumes:
        - name: config-volume
          configMap:
            name: cis-configs

        - name: tmp-volume
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: cis-auditor-service

spec:
  type: NodePort

  selector:
    app: cis-auditor

  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30000
